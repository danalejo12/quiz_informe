<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Tecnológico — SENA</title>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap');

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --card: #1a1a24;
      --border: rgba(255,255,255,0.08);
      --accent: #6c63ff;
      --accent2: #00e5a0;
      --text: #f0f0f5;
      --muted: #7a7a9a;
      --danger: #ff4d6d;
      --success: #00e5a0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(108,99,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,99,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .quiz-wrapper {
      width: 100%;
      max-width: 680px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .badge {
      display: inline-block;
      background: rgba(108,99,255,0.15);
      border: 1px solid rgba(108,99,255,0.3);
      color: #a89fff;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 100px;
      margin-bottom: 1rem;
    }

    .header h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 0%, #a89fff 50%, #00e5a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.75rem;
    }

    .header p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* Progress bar */
    .progress-track {
      background: var(--surface);
      border-radius: 100px;
      height: 4px;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 100px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      width: 0%;
    }

    .progress-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }

    /* Pantallas (screens) */
    .screen { display: none; }
    .screen.active { display: block; }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      animation: fadeUp 0.4s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Form fields */
    .field-label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.6rem;
      display: block;
    }

    input[type="text"], input[type="email"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      padding: 0.85rem 1.1rem;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    /* Pregunta */
    .question-number {
      font-size: 0.75rem;
      font-weight: 600;
      color: #a89fff;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    /* Opciones */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .option-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      padding: 0.9rem 1.25rem;
      text-align: left;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .option-btn:hover:not(:disabled) {
      border-color: rgba(108,99,255,0.5);
      background: rgba(108,99,255,0.08);
      transform: translateX(4px);
    }

    .option-btn.selected {
      border-color: var(--accent);
      background: rgba(108,99,255,0.15);
    }

    .option-btn.correct {
      border-color: var(--success);
      background: rgba(0,229,160,0.1);
    }

    .option-btn.incorrect {
      border-color: var(--danger);
      background: rgba(255,77,109,0.1);
    }

    .option-letter {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .selected .option-letter { background: var(--accent); }
    .correct .option-letter  { background: var(--success); color: #000; }
    .incorrect .option-letter { background: var(--danger); }

    /* Feedback */
    .feedback-box {
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-top: 1rem;
      padding: 0.9rem 1.1rem;
    }

    .feedback-box.correct-fb {
      background: rgba(0,229,160,0.08);
      border: 1px solid rgba(0,229,160,0.25);
      color: #6fffca;
    }

    .feedback-box.incorrect-fb {
      background: rgba(255,77,109,0.08);
      border: 1px solid rgba(255,77,109,0.25);
      color: #ff8fa3;
    }

    /* Botones principales */
    .btn {
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.9rem 2rem;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
      margin-top: 1.5rem;
    }

    .btn-primary:hover:not(:disabled) {
      background: #5a52e0;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(108,99,255,0.35);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Score screen */
    .score-display {
      text-align: center;
      padding: 1.5rem 0;
    }

    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: conic-gradient(var(--accent) var(--pct), rgba(255,255,255,0.06) 0);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      position: relative;
    }

    .score-ring::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: var(--card);
    }

    .score-num {
      position: relative;
      z-index: 1;
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
    }

    .score-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .score-sub {
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 0.5rem;
      text-align: center;
    }

    .stat-chip .num {
      font-size: 1.5rem;
      font-weight: 700;
      display: block;
    }

    .stat-chip .lbl {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .num.green { color: var(--success); }
    .num.red   { color: var(--danger); }
    .num.purple { color: #a89fff; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1.5rem;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.3s;
      z-index: 999;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.success { border-color: rgba(0,229,160,0.4); color: var(--success); }
    .toast.error   { border-color: rgba(255,77,109,0.4); color: var(--danger); }

    /* Loading spinner */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.5rem;
    }

    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem;
      padding: 0.7rem 1.2rem;
      transition: all 0.2s;
    }

    .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--text);
    }
  </style>
</head>
<body>

<div class="quiz-wrapper">

  <div class="header">
    <div class="badge">🚀 SENA · Quiz Tecnológico</div>
    <h1>¿Cuánto sabes de<br>Tecnología?</h1>
    <p>Responde las preguntas y descubre tu nivel. Tus resultados se guardan automáticamente.</p>
  </div>

  <!-- ===================== PANTALLA 1: Registro ===================== -->
  <div id="screen-register" class="screen active">
    <div class="card">
      <div style="margin-bottom:1.5rem;">
        <label class="field-label">Tu nombre completo</label>
        <input type="text" id="input-name" placeholder="Ej: Daniel Velasco" />
      </div>
      <div style="margin-bottom:1.5rem;">
        <label class="field-label">Correo electrónico</label>
        <input type="email" id="input-email" placeholder="tu@correo.com" />
      </div>
      <button class="btn btn-primary" id="btn-start" onclick="startQuiz()">
        Comenzar Quiz →
      </button>
    </div>
  </div>

  <!-- ===================== PANTALLA 2: Preguntas ===================== -->
  <div id="screen-quiz" class="screen">
    <div class="progress-label">
      Pregunta <span id="q-current">1</span> de <span id="q-total">5</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="card" id="question-card">
      <div class="question-number" id="q-num-label">PREGUNTA 1</div>
      <div class="question-text" id="q-text"></div>
      <div class="options-grid" id="q-options"></div>
      <div id="q-feedback" class="feedback-box" style="display:none;"></div>
      <div class="nav-row">
        <div id="time-indicator" style="color:var(--muted);font-size:0.85rem;"></div>
        <button class="btn btn-ghost" id="btn-next" onclick="nextQuestion()" disabled>
          Siguiente →
        </button>
      </div>
    </div>
  </div>

  <!-- ===================== PANTALLA 3: Resultados ===================== -->
  <div id="screen-result" class="screen">
    <div class="card">
      <div class="score-display">
        <div class="score-ring" id="score-ring">
          <span class="score-num" id="score-pct">0%</span>
        </div>
        <div class="score-title" id="result-title">¡Resultado!</div>
        <div class="score-sub" id="result-sub">Procesando...</div>
        <div class="stats-row">
          <div class="stat-chip">
            <span class="num green" id="stat-correct">0</span>
            <span class="lbl">Correctas</span>
          </div>
          <div class="stat-chip">
            <span class="num red" id="stat-wrong">0</span>
            <span class="lbl">Incorrectas</span>
          </div>
          <div class="stat-chip">
            <span class="num purple" id="stat-total">0</span>
            <span class="lbl">Total</span>
          </div>
        </div>
        <div id="save-status" style="color:var(--muted);font-size:0.9rem;margin-bottom:1rem;"></div>
        <button class="btn btn-primary" onclick="resetQuiz()">
          Intentar de nuevo ↺
        </button>
      </div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  /* ================================================================
     ▼▼▼  CONFIGURACIÓN SUPABASE  ▼▼▼
     Reemplaza con tus credenciales reales del proyecto en supabase.com
  ================================================================ */
  const SUPABASE_URL = 'https://eixuisxxxiklovcyqqin.supabase.co/rest/v1/';
  const SUPABASE_ANON_KEY = 'sb_publishable_c7KZtZ2oyJZUTwLUPMDfqQ_m2iWgpja';

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ================================================================
     ▼▼▼  BANCO DE PREGUNTAS  ▼▼▼
     Personaliza estas preguntas para tu quiz
  ================================================================ */
  const questions = [
    {
      text: "¿Qué significa el acrónimo 'API' en desarrollo de software?",
      options: [
        "Application Performance Index",
        "Application Programming Interface",
        "Automated Process Integration",
        "Advanced Protocol Implementation"
      ],
      correct: 1,
      explanation: "Una API (Application Programming Interface) es un conjunto de reglas que permite que dos aplicaciones se comuniquen entre sí."
    },
    {
      text: "¿Cuál de los siguientes es un lenguaje de programación orientado a objetos?",
      options: ["HTML", "CSS", "Python", "SQL"],
      correct: 2,
      explanation: "Python es un lenguaje multiparadigma que soporta OOP. HTML y CSS son lenguajes de marcado/estilo, y SQL es de consultas."
    },
    {
      text: "¿Qué es la 'nube' en el contexto tecnológico?",
      options: [
        "Un sistema operativo de Microsoft",
        "Servidores remotos para almacenar y procesar datos por internet",
        "Un tipo de red Wi-Fi empresarial",
        "Un software de edición gráfica"
      ],
      correct: 1,
      explanation: "La nube son servidores en internet (de empresas como AWS, Google, Azure) que permiten acceder a recursos computacionales sin tener hardware propio."
    },
    {
      text: "¿Cuál es la principal función de una base de datos relacional?",
      options: [
        "Mostrar páginas web",
        "Conectar dispositivos en red",
        "Almacenar datos estructurados en tablas relacionadas entre sí",
        "Compilar código fuente"
      ],
      correct: 2,
      explanation: "Las BD relacionales (como PostgreSQL, MySQL) organizan datos en tablas con filas/columnas y permiten relacionarlas mediante claves."
    },
    {
      text: "¿Qué es Git en el desarrollo de software?",
      options: [
        "Un editor de código",
        "Un sistema de control de versiones distribuido",
        "Un lenguaje de programación",
        "Una base de datos NoSQL"
      ],
      correct: 1,
      explanation: "Git es un VCS (Version Control System) que rastrea cambios en el código, permite trabajar en equipo y revertir errores."
    }
  ];

  /* ================================================================
     ESTADO GLOBAL
  ================================================================ */
  let state = {
    name: '',
    email: '',
    currentIndex: 0,
    answers: [],        // { questionIndex, selectedOption, isCorrect, timestamp }
    score: 0,
    answered: false,
    startedAt: null
  };

  /* ================================================================
     FUNCIONES PRINCIPALES
  ================================================================ */

  function startQuiz() {
    const name  = document.getElementById('input-name').value.trim();
    const email = document.getElementById('input-email').value.trim();

    if (!name || !email) {
      showToast('Por favor completa todos los campos', 'error');
      return;
    }

    if (!email.includes('@')) {
      showToast('Ingresa un correo válido', 'error');
      return;
    }

    state.name      = name;
    state.email     = email;
    state.startedAt = new Date().toISOString();

    showScreen('screen-quiz');
    document.getElementById('q-total').textContent = questions.length;
    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[state.currentIndex];
    const idx = state.currentIndex;

    state.answered = false;
    document.getElementById('btn-next').disabled = true;

    // Metadata
    document.getElementById('q-current').textContent = idx + 1;
    document.getElementById('q-num-label').textContent = `PREGUNTA ${idx + 1}`;
    document.getElementById('q-text').textContent = q.text;

    // Progress
    const pct = (idx / questions.length) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';

    // Opciones
    const container = document.getElementById('q-options');
    container.innerHTML = '';
    const letters = ['A', 'B', 'C', 'D'];

    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `
        <span class="option-letter">${letters[i]}</span>
        <span>${opt}</span>
      `;
      btn.onclick = () => selectAnswer(i);
      container.appendChild(btn);
    });

    // Limpiar feedback
    const fb = document.getElementById('q-feedback');
    fb.style.display = 'none';
    fb.textContent = '';
  }

  function selectAnswer(optionIndex) {
    if (state.answered) return;
    state.answered = true;

    const q = questions[state.currentIndex];
    const isCorrect = optionIndex === q.correct;
    const buttons = document.querySelectorAll('.option-btn');

    // Registrar respuesta
    state.answers.push({
      questionIndex: state.currentIndex,
      questionText:  q.text,
      selectedOption: q.options[optionIndex],
      correctOption:  q.options[q.correct],
      isCorrect,
      answeredAt: new Date().toISOString()
    });

    if (isCorrect) state.score++;

    // Estilos de feedback
    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.correct)  btn.classList.add('correct');
      if (i === optionIndex && !isCorrect) btn.classList.add('incorrect');
    });

    // Mensaje de feedback
    const fb = document.getElementById('q-feedback');
    fb.style.display = 'block';
    fb.className = `feedback-box ${isCorrect ? 'correct-fb' : 'incorrect-fb'}`;
    fb.textContent = (isCorrect ? '✓ ¡Correcto! ' : '✗ Incorrecto. ') + q.explanation;

    document.getElementById('btn-next').disabled = false;
  }

  function nextQuestion() {
    state.currentIndex++;

    if (state.currentIndex >= questions.length) {
      showResults();
      return;
    }

    renderQuestion();
  }

  async function showResults() {
    showScreen('screen-result');

    const total   = questions.length;
    const correct = state.score;
    const wrong   = total - correct;
    const pct     = Math.round((correct / total) * 100);

    // Animación del ring
    document.getElementById('score-ring').style.setProperty('--pct', pct + '%');
    document.getElementById('score-pct').textContent = pct + '%';
    document.getElementById('stat-correct').textContent = correct;
    document.getElementById('stat-wrong').textContent   = wrong;
    document.getElementById('stat-total').textContent   = total;

    // Mensaje según puntaje
    let title, sub;
    if (pct >= 80) {
      title = '¡Excelente resultado! 🏆';
      sub   = 'Tienes un conocimiento sólido en tecnología.';
    } else if (pct >= 60) {
      title = '¡Buen trabajo! 👍';
      sub   = 'Estás en buen camino. Sigue aprendiendo.';
    } else {
      title = '¡Sigue practicando! 💪';
      sub   = 'Con dedicación lo lograrás. No te rindas.';
    }

    document.getElementById('result-title').textContent = title;
    document.getElementById('result-sub').textContent   = sub;

    // Guardar en Supabase
    await saveToSupabase(correct, total, pct);
  }

  async function saveToSupabase(correct, total, pct) {
    const statusEl = document.getElementById('save-status');
    statusEl.innerHTML = '<span class="spinner"></span> Guardando resultados...';

    const payload = {
      nombre:            state.name,
      email:             state.email,
      score_correcto:    correct,
      score_total:       total,
      porcentaje:        pct,
      respuestas:        state.answers,   // JSON con detalle pregunta a pregunta
      tiempo_inicio:     state.startedAt,
      tiempo_fin:        new Date().toISOString()
    };

    const { error } = await db
      .from('quiz_resultados')    // ← nombre de la tabla en Supabase
      .insert([payload]);

    if (error) {
      console.error('Supabase error:', error);
      statusEl.textContent = '⚠️ No se pudo guardar. Revisa la consola.';
      showToast('Error al guardar: ' + error.message, 'error');
    } else {
      statusEl.textContent = '✅ Resultados guardados correctamente.';
      showToast('¡Resultado guardado! 🎉', 'success');
    }
  }

  function resetQuiz() {
    state = {
      name: state.name,
      email: state.email,
      currentIndex: 0,
      answers: [],
      score: 0,
      answered: false,
      startedAt: new Date().toISOString()
    };
    showScreen('screen-quiz');
    renderQuestion();
  }

  /* ================================================================
     UTILIDADES
  ================================================================ */

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = `toast ${type} show`;
    setTimeout(() => { t.className = 'toast'; }, 3500);
  }
</script>
